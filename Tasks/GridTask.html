<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="./GridTask.css">
  <title>Document</title>
</head>
<body>
  <section class="parent">
    
    <section class="child contact">Contact Us</section>
    <section class="child form">
      <form action="">
      <label for="name" class="username">Username:</label>
      <input type="text" id="name" name="name" required pattern="[A-Za-z]{10,}" >
      <br>
       <label for="Password" class="email">Email Id:</label>
      <input type="email" id="email" name="email" required pattern="[A-Z@#a-z0-1]">
      <br>
      <label for="Password" class="password">Password:</label>
      <input type="password" id="Password" name="Password">
      <br>
      <button type="submit" >Submit</button>  
      </form>   
    </section>
    <section class="child map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3993.504526460612!2d73.72778857519329!3d18.584627082521337!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bbc5bdb7377d%3A0x51d1899a13fe365e!2sStreets%20of%20Europe!5e1!3m2!1sen!2sin!4v1790873398734!5m2!1sen!2sin" width="300" height="250" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>
    <section class="child icon">
      <i class="fa-brands fa-square-whatsapp fa-beat-fade"></i>
      <i class="fa-brands fa-square-facebook fa-beat-fade"></i>
      <i class="fa-brands fa-square-instagram fa-beat-fade"></i>
    </section>
        <textarea name="message" id="message" cols="30" rows="10" placeholder="Enter your feedback here..."></textarea>
    </section>
  </section>
</body>
</html>
